# Render Blueprint for Electric Sence LMS & RAG Platform
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: electric-sence
    env: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: electric-sence-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false # Set securely in Render dashboard
      - key: ADMIN_KEY
        sync: false # Set your faculty admin passcode in Render dashboard

